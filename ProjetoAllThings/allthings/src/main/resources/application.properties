spring.application.name=allthings

#Configuração do banco de dados
spring.datasource.url=jdbc:postgresql://localhost:5432/db_allthings
spring.datasource.username=postgres
spring.datasource.password=123456

#Configuração do JPA/Hibernate

#Atualizar o banco de dados automaticamente
spring.jpa.hibernate.ddl-auto=update

#Limpar o cache para a execução do Thymeleaf
spring.thymeleaf.cache=false

#Exibir no terminal o SQL sendo executado
spring.jpa.show-sql=true

#Limitar o tamanho máximo do arquivo enviado para 2Mb
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Clientes</title>
</head>
<body>
    <h1 style="text-align: center;">Cadastro de Clientes</h1>
    <form th:action="@{/clientes/salvar}" 
          method="post" 
          th:object="${cliente}" 
          enctype="multipart/form-data">

        <input type="hidden" name="idCliente" th:field="*{idCliente}" />

        <label for="nomeCliente">Nome:</label>
        <input 
            type="text" 
            id="nomeCliente" 
            name="nomeCliente"
            th:field="*{nomeCliente}">
        <br /><br />
        <label for="enderecoCliente">Endereço:</label>
        <input 
            type="text" 
            id="enderecoCliente" 
            name="enderecoCliente"
            th:field="*{enderecoCliente}">
        <br /><br />
        <label for="cidadeCliente">Cidade:</label>
        <input 
            type="text" 
            id="cidadeCliente" 
            name="cidadeCliente"
            th:field="*{cidadeCliente}">
        <br /><br />
        <label for="estadoCliente">Estado:</label>
        <input 
            type="text" 
            id="estadoCliente" 
            name="estadoCliente"
            th:field="*{estadoCliente}">
        <br /><br />
        <label for="cepCliente">CEP:</label>
        <input 
            type="text" 
            id="cepCliente" 
            name="cepCliente"
            th:field="*{cepCliente}">
        <br /><br />
        <label for="cpfCliente">CPF:</label>
        <input 
            type="text" 
            id="cpfCliente" 
            name="cpfCliente"
            th:field="*{cpfCliente}">
        <br /><br />
        <label for="rgCliente">RG:</label>
        <input 
            type="text" 
            id="rgCliente" 
            name="rgCliente"
            th:field="*{rgCliente}">
        <br /><br />
        <label>Foto:</label>
        <input type="file" name="foto" accept="image/*" />
        <br />
        *Tamanho máximo: 2Mb

        <br /><br />
        <button type="submit">Salvar Cliente</button>
    </form>
    
</body>
</html>

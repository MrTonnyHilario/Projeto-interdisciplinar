<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>conta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container d-flex justify-content-center align-items-center meu-cadastro">
    <div>
    <form action="#">
        <div class="mb-3">
            <label for="name" class="for-label"> Nome:</label>
            <input type="text" 
            class="for-control" 
            id="nome" placeholder="Insira seu Nome">
        </div>
        <div class="mb-3">
            <label for="email" class="for-label"> Email:</label>
            <input type="email" 
            class="for-control" 
            id="email" placeholder="Insira seu email">
        </div>
        <div class="mb-3">
            <label for="password" class="for-label"> Senha:</label>
            <input type="password" 
            class="for-control" 
            id="senha" placeholder="Insira uma Senha">
            </div>
        </div>
    </form>
</div>
</body>
